# Ganged Reality — Nginx + PM2 Deployment Reference

server {
    listen 80;
    server_name sanaltur.uskudarkentas.com.tr;

    # ── SPA Static Files ─────────────────────────────────────────────
    root /var/www/gangedreality/dist;
    index index.html;

    # ── Proje Veri Dosyaları (PROJECTS_STORAGE_PATH) ─────────────────
    # Nginx bu dizinden dosyaları doğrudan serve eder (model, texture, JSON)
    location /data/ {
        alias /var/www/gangedreality/projects/;
        expires 1h;
        add_header Cache-Control "public, no-transform";

        # CORS header (isteğe bağlı)
        add_header Access-Control-Allow-Origin *;
    }

    # ── API Proxy → Express Backend ──────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Büyük model upload'ları için
        client_max_body_size 200M;
        proxy_read_timeout 120s;
    }

    # ── SPA Fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip Compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}

# ─────────────────────────────────────────────────────────────────────
# HTTPS ile kullanmak için:
#   sudo certbot --nginx -d sanaltur.uskudarkentas.com.tr
#
# PM2 ile backend başlatma:
#   cd /var/www/gangedreality/server
#   npm run build
#   pm2 start dist/index.js --name "gr-api" --env-file .env.production
#
# Veya manuel:
#   pm2 start dist/index.js --name "gr-api" \
#     --env PORT=3003 \
#     --env PROJECTS_STORAGE_PATH=/var/www/gangedreality/projects \
#     --env API_EDITOR_PASSWORD=your_secure_password \
#     --env JWT_SECRET=your_random_secret_key
#   pm2 save
#   pm2 startup
#
# Frontend build:
#   cd /var/www/gangedreality
#   npm run build
#   # dist/ klasörü Nginx root'unda
#
# Günlük backup (crontab -e):
#   0 3 * * * tar -czf /backups/gr-$(date +\%Y\%m\%d).tar.gz /var/www/gangedreality/projects/
# ─────────────────────────────────────────────────────────────────────
